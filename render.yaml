services:
  - type: web
    name: vajranet-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "https://vajranet.vercel.app,http://localhost:5173,capacitor://localhost,*"
      - key: AI_PROVIDER
        value: mock
      - key: ENABLE_CLOUDINARY
        value: "false"
